<nav class="katino-navbar">
  <div class="navbar-inner container-fluid">
    <a routerLink="/" class="navbar-brand">
      <img src="assets/images/logo.webp" alt="KATINO" class="brand-logo" />
      <span class="brand-name">KATINO</span>
    </a>

    <ul class="nav-links d-none d-lg-flex">
      <li>
        <a
          routerLink="/main"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="nav-link"
        >
          {{ "navbar.home" | translate }}
        </a>
      </li>
      <li>
        <a
          routerLink="/catalog"
          routerLinkActive="active"
          class="nav-link"
        >
          {{ "navbar.catalog" | translate }}
        </a>
      </li>
    </ul>

    <div class="navbar-right d-none d-lg-flex">
      <div class="search-box">
        <mat-icon class="search-icon" (click)="onSearch(desktopSearch.value)">search</mat-icon>
        <input
          #desktopSearch
          type="text"
          class="search-input"
          [placeholder]="'navbar.searchPlaceholder' | translate"
          [value]="searchQuery"
          (input)="onInput(desktopSearch.value)"
          (keyup.enter)="onSearch(desktopSearch.value)"
        />
      </div>

      <div class="lang-selector">
        <button
          class="lang-btn"
          [class.active]="currentLanguage === uaLang"
          (click)="setLanguage(uaLang)"
        >
          {{ "languageSelection.ua" | translate }}
        </button>
        <span class="lang-divider">|</span>
        <button
          class="lang-btn"
          [class.active]="currentLanguage === enLang"
          (click)="setLanguage(enLang)"
        >
          {{ "languageSelection.en" | translate }}
        </button>
      </div>

      <ng-container *ngIf="auth$ | async as auth">
        <ng-container *ngIf="auth.isLoggedIn; else desktopLogin">
          <button
            type="button"
            class="icon-btn"
            [matMenuTriggerFor]="accountMenu"
            [attr.aria-label]="'navbar.account' | translate"
          >
            <mat-icon>person_outline</mat-icon>
          </button>
          <mat-menu #accountMenu="matMenu" xPosition="before">
            <div class="account-email" *ngIf="auth.email">{{ auth.email }}</div>
            <button mat-menu-item (click)="logout()">
              <mat-icon>logout</mat-icon>
              <span>{{ "navbar.logout" | translate }}</span>
            </button>
          </mat-menu>
        </ng-container>
        <ng-template #desktopLogin>
          <a class="nav-link login-link" [routerLink]="loginRoute" [queryParams]="loginQueryParams">
            {{ "navbar.login" | translate }}
          </a>
        </ng-template>
      </ng-container>
    </div>

    <a
      class="icon-btn cart-link"
      [routerLink]="cartRoute"
      routerLinkActive="active"
      [attr.aria-label]="'navbar.cart' | translate"
    >
      <mat-icon
        [matBadge]="itemsCount$ | async"
        [matBadgeHidden]="!(itemsCount$ | async)"
        matBadgeSize="small"
        matBadgeColor="accent"
        aria-hidden="false"
      >shopping_bag</mat-icon>
    </a>

    <button
      class="mobile-toggle d-flex d-lg-none"
      (click)="toggleMobileMenu()"
      [attr.aria-label]="'navbar.toggleMenu' | translate"
      [attr.aria-expanded]="mobileMenuOpen"
    >
      <mat-icon>{{ mobileMenuOpen ? "close" : "menu" }}</mat-icon>
    </button>
  </div>

  <div class="mobile-menu" [class.open]="mobileMenuOpen">
    <div class="mobile-search">
      <mat-icon class="search-icon" (click)="onSearch(mobileSearch.value)">search</mat-icon>
      <input
        #mobileSearch
        type="text"
        class="search-input"
        [placeholder]="'navbar.searchPlaceholder' | translate"
        [value]="searchQuery"
        (input)="onInput(mobileSearch.value)"
        (keyup.enter)="onSearch(mobileSearch.value)"
      />
    </div>

    <ul class="mobile-nav-links">
      <li>
        <a
          routerLink="/main"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="mobile-nav-link"
          (click)="mobileMenuOpen = false"
        >
          {{ "navbar.home" | translate }}
        </a>
      </li>
      <li>
        <a
          routerLink="/catalog"
          routerLinkActive="active"
          class="mobile-nav-link"
          (click)="mobileMenuOpen = false"
        >
          {{ "navbar.catalog" | translate }}
        </a>
      </li>
      <ng-container *ngIf="auth$ | async as auth">
        <li *ngIf="auth.isLoggedIn; else mobileLogin">
          <button type="button" class="mobile-nav-link" (click)="logout()">
            {{ "navbar.logout" | translate }}
            <span class="mobile-account-email" *ngIf="auth.email">({{ auth.email }})</span>
          </button>
        </li>
        <ng-template #mobileLogin>
          <li>
            <a
              [routerLink]="loginRoute"
              [queryParams]="loginQueryParams"
              routerLinkActive="active"
              class="mobile-nav-link"
              (click)="mobileMenuOpen = false"
            >
              {{ "navbar.login" | translate }}
            </a>
          </li>
        </ng-template>
      </ng-container>
    </ul>

    <div class="mobile-lang-selector">
      <button
        class="lang-btn"
        [class.active]="currentLanguage === uaLang"
        (click)="setLanguage(uaLang)"
      >
        {{ "languageSelection.ua" | translate }}
      </button>
      <span class="lang-divider">|</span>
      <button
        class="lang-btn"
        [class.active]="currentLanguage === enLang"
        (click)="setLanguage(enLang)"
      >
        {{ "languageSelection.en" | translate }}
      </button>
    </div>
  </div>
</nav>

<div class="content-wrapper">
  <router-outlet></router-outlet>
</div>
